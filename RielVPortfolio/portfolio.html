nav ul {

nav ul li a {

nav ul li a:hover {

.banner img {
  width: 100%;
  height: 500px; /* adjust this to make strip thinner or thicker */
  object-fit: cover;
  object-position: 50% 40%; /* change this to move the visible area */
  display: block;
}

.banner-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  text-align: center;
  color: white;
  font-size: 100px;
  font-weight: bold;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.6); /* makes it readable on photos */
  line-height: 1.1
}

.banner-text p {

  font-size: 22px;

  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  line-height: 1.5
}

/* ---- Footer ---- */
footer {
  text-align: center;
  padding: 20px 0;
  color: #aaa;
  background: #000;
  border-top: 1px solid #222;
  font-size: 14px;
}






.simple-carousel-section {
  background: white;
  text-align: center;
}

.simple-carousel-section {
  color: black;
  font-size: 48px;
  letter-spacing: 5px;
  margin-bottom: 30px;
}

.section-title {
  color: black;
  font-size: 48px;
  letter-spacing: 2px;
    margin-bottom: 0px;
      margin-top: 30px;
}

.simple-carousel-container {
  position: relative;
  width: 90%;
  margin: auto;
}
.simple-carousel {
  overflow: hidden;
  width: 100%;
}

.simple-track {
  display: flex;
  transition: transform 0.5s ease;
}

.simple-track img {
  width: 350px;     
  height: 450px;
  object-fit: cover;
  margin-right: 10px;
  border-radius: 5px;
}

.simple-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.6);
  border: none;
  color: white;
  padding: 12px 16px;
  font-size: 28px;
  cursor: pointer;
  border-radius: 50%;
  z-index: 10;
}

.simple-arrow.left {
  left: 10px;
}

.simple-arrow.right {
  right: 10px;
}

.simple-arrow:hover {
  background: rgba(0, 0, 0, 0.85);
}
